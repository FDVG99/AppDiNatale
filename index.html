<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <title>Acceso POS & Stock</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 32px 24px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.4);
    }
    h1 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 24px; line-height: 1.4; }
    #g-btn-container { display: flex; justify-content: center; }
    .status { font-size: 12px; color: #34d399; margin-top: 16px; display: none; font-weight: 600; }
  </style>
</head>
<body>

  <div id="loginBox" class="login-card">
    <h1>POS & Control de Stock</h1>
    <p>Inicia sesión con tu cuenta Google autorizada para acceder al sistema.</p>
    <div id="g-btn-container"></div>
    <div id="statusMsg" class="status">Abriendo sistema POS...</div>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = "730658342794-pco5q0hu3lv6ppqttq6hf0q4tqg7aplb.apps.googleusercontent.com";
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbw6Oty3HrcVvazf4iU2x_UNAK5pw8sP7X4tbQd_QVyoJZ8nnvhG_BOHdA5XB1GUdg/exec";
    const STORAGE_KEY = "pos_gas_id_token";

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("reset") === "1") {
      localStorage.removeItem(STORAGE_KEY);
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    function isTokenValid(token) {
      if (!token) return false;
      try {
        const parts = token.split(".");
        if (parts.length !== 3) return false;
        const payload = JSON.parse(atob(parts[1].replace(/-/g, "+").replace(/_/g, "/")));
        const now = Math.floor(Date.now() / 1000);
        return payload.exp && payload.exp > (now + 60);
      } catch (e) {
        return false;
      }
    }

    function launchApp(token) {
      document.getElementById("statusMsg").style.display = "block";
      window.location.replace(GAS_WEBAPP_URL + "?token=" + encodeURIComponent(token));
    }

    function handleCredentialResponse(response) {
      if (response && response.credential) {
        localStorage.setItem(STORAGE_KEY, response.credential);
        launchApp(response.credential);
      }
    }

    window.onload = function () {
      const savedToken = localStorage.getItem(STORAGE_KEY);
      if (isTokenValid(savedToken)) {
        launchApp(savedToken);
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
        ux_mode: "popup"
      });

      google.accounts.id.renderButton(
        document.getElementById("g-btn-container"),
        { theme: "filled_blue", size: "large", shape: "pill", text: "signin_with" }
      );
    };
  </script>
</body>
</html>
